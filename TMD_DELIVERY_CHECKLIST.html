<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoBuild Security Vault • Documento Confidencial Protegido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #060608;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(255, 184, 0, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
      color: #f4f4f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .vault-card {
      background: rgba(14, 14, 18, 0.95);
      border: 1px solid rgba(255, 184, 0, 0.28);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85), 0 0 40px rgba(255, 184, 0, 0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .vault-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ffb800, #10b981, transparent);
    }
    .shield-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 18px auto;
      border-radius: 16px;
      background: rgba(255, 184, 0, 0.12);
      border: 1px solid rgba(255, 184, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }
    .company-title {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffb800;
      margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
    }
    .vault-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
    }
    .vault-desc {
      font-size: 0.82rem;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .input-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #71717a;
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .pin-input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .pin-input:focus {
      border-color: #ffb800;
      box-shadow: 0 0 0 3px rgba(255, 184, 0, 0.15);
    }
    .unlock-btn {
      width: 100%;
      padding: 13px 20px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ffb800 0%, #d97706 100%);
      color: #000000;
      font-size: 0.88rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .unlock-btn:hover {
      opacity: 0.94;
    }
    .unlock-btn:active {
      transform: scale(0.99);
    }
    .error-msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 0.8rem;
      display: none;
      line-height: 1.4;
    }
    .security-badge {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: #52525b;
      font-family: 'JetBrains Mono', monospace;
    }
    .security-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
  </style>
</head>
<body>
  <div class="vault-card" id="vaultCard">
    <div class="shield-icon">🛡️</div>
    <div class="company-title">TodoBuild Security Vault</div>
    <h1 class="vault-title">Documento Protegido</h1>
    <p class="vault-desc">Esta lista de entrega contiene especificaciones confidenciales del proyecto. Ingrese el PIN de autorización para descifrar el contenido.</p>

    <div class="input-group">
      <label class="input-label" for="passInput">PIN / Clave de Acceso</label>
      <input type="password" id="passInput" class="pin-input" placeholder="••••••••••••" autofocus autocomplete="current-password">
    </div>

    <button type="button" class="unlock-btn" onclick="attemptDecrypt()">
      <span>Desbloquear Documento</span>
      <span>→</span>
    </button>

    <div class="error-msg" id="errorMsg">
      ⚠️ Acceso Denegado: PIN de seguridad incorrecto.
    </div>

    <div class="security-badge">
      <span class="security-dot"></span>
      <span>AES-256-GCM · PBKDF2 (100k) Cifrado Militar</span>
    </div>
  </div>

    function b64ToUint8Array(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        arr[i] = bin.charCodeAt(i);
      }
      return arr;
    }

    document.getElementById("passInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        attemptDecrypt();
      }
    });

    async function attemptDecrypt() {
      const pass = document.getElementById("passInput").value;
      const errorEl = document.getElementById("errorMsg");
      const cardEl = document.getElementById("vaultCard");
      errorEl.style.display = "none";

      if (!pass) return;

      try {
        const salt = b64ToUint8Array(SALT_B64);
        const iv = b64ToUint8Array(IV_B64);
        const ciphertext = b64ToUint8Array(CIPHERTEXT_B64);

        const enc = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
          "raw",
          enc.encode(pass),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );

        const derivedKey = await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: 100000,
            hash: "SHA-256"
          },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const decryptedBuffer = await window.crypto.subtle.decrypt(
          {
            name: "AES-GCM",
            iv: iv
          },
          derivedKey,
          ciphertext
        );

        const dec = new TextDecoder("utf-8");
        const decryptedHtml = dec.decode(decryptedBuffer);

        document.open();
        document.write(decryptedHtml);
        document.close();
      } catch (err) {
        console.error("Decryption error:", err);
        errorEl.style.display = "block";
        cardEl.classList.remove("shake");
        void cardEl.offsetWidth;
        cardEl.classList.add("shake");
      }
    }
