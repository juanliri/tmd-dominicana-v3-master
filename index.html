    <script>
      function openExecPortal() {
        document.getElementById('todobuild-exec-portal-modal').style.display = 'block';
      }
      function closeExecPortal() {
        document.getElementById('todobuild-exec-portal-modal').style.display = 'none';
      }
      function openStaffModal(data) {
        document.getElementById('staff-modal-img').src = data.img;
        document.getElementById('staff-modal-name').innerText = data.name;
        document.getElementById('staff-modal-role').innerText = data.role;
        document.getElementById('staff-modal-badge').innerText = data.badge;
        document.getElementById('staff-modal-bio').innerText = data.bio;
        var modal = document.getElementById('tmd-staff-detail-modal');
        modal.style.display = 'flex';
      }
      function closeStaffModal() {
        document.getElementById('tmd-staff-detail-modal').style.display = 'none';
      }

      // Close modal on background click
      document.getElementById('tmd-staff-detail-modal').addEventListener('click', function(e) {
        if (e.target === this) closeStaffModal();
      });

      // Intercept any click on "Portal VIP" button in the React navbar
      document.addEventListener('click', function(e) {
        var target = e.target.closest('button, a');
        if (target && target.innerText && target.innerText.includes('Portal VIP')) {
          e.preventDefault();
          e.stopPropagation();
          openExecPortal();
        }
      }, true);

      // Staff details dataset for intriguing interactive card discovery
      var staffData = {
        "Eduardo Lopez": {
          badge: "ALTA DIRECCIÓN TMD",
          bio: "Más de 20 años al frente de la distribución oficial y servicio técnico de maquinaria pesada en República Dominicana. Liderando la representación oficial de JCB, LiuGong, Ammann, LS Tractor y Yanmar desde la sede central de Km 22 Duarte."
        },
        "Eduardo E. Lopez": {
          badge: "MERCADEO & ESTRATEGIA DIGITAL",
          bio: "Especialista en la expansión digital y posicionamiento omnicanal de la flota pesada TMD. Coordinador de campañas industriales, lanzamientos de nuevos modelos 0 Km y experiencia comercial del cliente."
        },
        "Jorge Torres": {
          badge: "DIVISIÓN MAQUINARIA",
          bio: "Gestión comercial y técnica de equipos de movimiento de tierras, construcción civil y maquinaria agrícola. Asesor clave en adquisiciones corporativas y contratos de flota a nivel nacional."
        },
        "Carmen Jaquez": {
          badge: "FINANZAS & CRÉDITO",
          bio: "Supervisión contable, facilidades de crédito corporativo y financiamiento para adquisición y renta de maquinaria pesada. Gestión financiera orientada a la sostenibilidad operativa del cliente."
        },
        "Miguel Angel Cruz": {
          badge: "ADMINISTRACIÓN CENTRAL",
          bio: "Dirección logística y control administrativo integral de la sede central Km 22, asegurando abastecimiento ininterrumpido de repuestos y soporte a todas las divisiones de campo."
        },
        "Edwin Martinez": {
          badge: "SERVICIOS & CAMPO 24/7",
          bio: "Liderazgo técnico en talleres y cuadrillas de respuesta móvil. Diagnóstico computarizado LiveLink, calibración hidráulica y programas de mantenimiento preventivo y correctivo in situ."
        },
        "Blasina Fabian": {
          badge: "TALENTO HUMANO & CERTIFICACIÓN",
          bio: "Formación continua y certificación oficial del equipo técnico y de operadores bajo estándares internacionales de los fabricantes oficiales de TMD."
        },
        "Elvys Alcantara": {
          badge: "TALLER CENTRAL KM 22",
          bio: "Supervisión directa de las 8 bahías técnicas de overhaul heavy, reparación de transmisiones, rectificación de motores diesel y bancos de prueba de alta presión."
        },
        "Julio Aguasvivas": {
          badge: "SANTO DOMINGO & D.N.",
          bio: "Consultoría senior especializada en venta y renta de excavadoras, retroexcavadoras y rodillos compactadores para grandes contratistas del Gran Santo Domingo y el Distrito Nacional."
        },
        "Brito Fuentes": {
          badge: "ZONA NORTE & CIBAO",
          bio: "Atención técnica y comercial directa a proyectos viales, canteras y explotaciones agrícolas en Santiago, La Vega, San Francisco y toda la región del Cibao."
        },
        "Leonardo Encarnacion": {
          badge: "ZONA ESTE & BÁVARO",
          bio: "Soporte dedicado al sector turístico, infraestructuras hoteleras y desarrollo urbano en Punta Cana, Bávaro, La Romana y San Pedro de Macorís."
        },
        "Perkin Soriano": {
          badge: "LÍNEA AGRÍCOLA & SUR",
          bio: "Especialista en tractores agrícolas LS Tractor, minicargadores y soluciones mecanizadas para agroproductores e industrias de la región Sur y Central."
        }
      };

      // Enrich staff cards with badges & click intrigue
      function enrichStaffSection() {
        var eq = document.getElementById('equipo');
        if (!eq) return;

        // President showcase badge & click
        var presBox = eq.querySelector('.flex.flex-col.items-center.justify-center.mb-16');
        if (presBox && !presBox.getAttribute('data-interactive')) {
          presBox.setAttribute('data-interactive', 'true');
          presBox.style.cursor = 'pointer';
          presBox.addEventListener('click', function() {
            var img = presBox.querySelector('img') ? presBox.querySelector('img').src : '/assets/team_hd/eduardo_lopez_hd.jpg';
            openStaffModal({
              img: img,
              name: 'Don Eduardo López',
              role: 'PRESIDENTE & GERENTE GENERAL',
              badge: staffData['Eduardo Lopez'].badge,
              bio: staffData['Eduardo Lopez'].bio
            });
          });
        }

        // All other cards in grids
        var cards = eq.querySelectorAll('.grid > div');
        cards.forEach(function(card) {
          if (card.getAttribute('data-interactive')) return;
          card.setAttribute('data-interactive', 'true');

          var hElement = card.querySelector('h5, h6');
          var name = hElement ? hElement.innerText.trim() : '';
          var info = staffData[name];

          if (info) {
            // Add subtle department badge above name if not present
            var nameBox = card.querySelector('.bg-neutral-900, .bg-neutral-950');
            if (nameBox && !nameBox.querySelector('.staff-badge-tag')) {
              var tag = document.createElement('div');
              tag.className = 'staff-badge-tag';
              tag.style.cssText = 'font-size:0.58rem; font-family:monospace; font-weight:800; color:#fbbf24; opacity:0.85; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:2px;';
              tag.innerText = info.badge;
              nameBox.insertBefore(tag, nameBox.firstChild);
            }

            // Interactive click for intriguing bio modal
            card.addEventListener('click', function(e) {
              e.preventDefault();
              var img = card.querySelector('img') ? card.querySelector('img').src : '';
              var role = card.querySelector('span') ? card.querySelector('span').innerText.trim() : '';
              openStaffModal({
                img: img,
                name: name,
                role: role,
                badge: info.badge,
                bio: info.bio
              });
            });
          }
        });
      }

      // Scroll reveal observer
      var observer = new MutationObserver(enrichStaffSection);
      observer.observe(document.body, { childList: true, subtree: true });
      window.addEventListener('hashchange', function() {
        setTimeout(enrichStaffSection, 80);
      });
      document.addEventListener('DOMContentLoaded', enrichStaffSection);
    </script>
